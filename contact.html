<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Awesome Blog - Contact</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
     <div class="container header-content">
       <a href="index.html" class="logo">My Awesome Blog</a>
       <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
       <nav>
         <a href="index.html">Home</a>
         <a href="blog.html">Blog</a>
         <a href="about.html">About</a>
         <a href="contact.html" class="active">Contact</a>
       </nav>
     </div>
  </header>

  <main class="container">
    <h1>Contact Us</h1>
    <p>Have questions, suggestions, or just want to say hello? Fill out the form below!</p>

    <form id="contactForm" novalidate>
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required />
        <div class="error-message" id="nameError"></div>
      </div>

      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />
        <div class="error-message" id="emailError"></div>
      </div>

      <div class="form-group">
        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>
        <div class="error-message" id="messageError"></div>
      </div>

      <button type="submit">Send Message</button>
      <div id="formStatus"></div>
    </form>

  </main>

  <footer>
    <div class="container">
      <p>© 2025 My Awesome Blog. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
